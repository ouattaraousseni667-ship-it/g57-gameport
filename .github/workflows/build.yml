name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies + Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Vite project
        run: npm run build

      - name: Init Capacitor if needed
        run: npx cap init GameHub com.g57.gamehub --web-dir=dist || true

      - name: Add Android platform
        run: npx cap add android || true

      - name: Fix Kotlin version conflict
        working-directory: android
        run: |
          echo "kotlin.version=1.9.22" >> gradle.properties

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-G57-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
