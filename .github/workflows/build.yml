name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
        
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses
        
      - name: Install NPM deps
        run: npm install
        
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
        
      - name: Build Web App
        run: npm run build
        
      - name: Add Android Platform
        run: npx cap add android || true
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Fix Java Version
        working-directory: android
        run: |
          echo "org.gradle.java.home=$JAVA_HOME_17_X64" >> gradle.properties
          sed -i 's/VERSION_21/VERSION_17/g' app/build.gradle || true
          sed -i 's/VERSION_20/VERSION_17/g' app/build.gradle || true
          
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
